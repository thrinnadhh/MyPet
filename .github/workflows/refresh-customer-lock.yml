name: Refresh Customer Lockfile

# One-shot maintenance workflow used to make the committed npm lockfile match
# the security override before normal npm ci validation runs.
on:
  pull_request:
    paths:
      - "apps/customer-app/package.json"
      - ".github/workflows/refresh-customer-lock.yml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: apps/customer-app/package-lock.json

      - name: Patch vulnerable nested lock entry
        working-directory: apps/customer-app
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          const key = 'node_modules/@istanbuljs/load-nyc-config/node_modules/js-yaml';
          const entry = lock.packages?.[key];
          if (!entry) throw new Error(`Missing lock entry: ${key}`);
          if (entry.version !== '3.15.0' && entry.version !== '3.15.1') {
            throw new Error(`Unexpected js-yaml version: ${entry.version}`);
          }
          entry.version = '3.15.1';
          entry.resolved = 'https://registry.npmjs.org/js-yaml/-/js-yaml-3.15.1.tgz';
          entry.integrity = 'sha512-S99WuO3HlhO3XN41EtYUNl9zzXjoJx7QvmipxsJVxtCBT0YHEFy+iOJhjSvrmV12nYhWpZaM8lPHkJm0yUMbag==';
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE

      - name: Verify clean install and security audit
        working-directory: apps/customer-app
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Commit lockfile
        run: |
          if git diff --quiet -- apps/customer-app/package-lock.json; then
            echo "Customer lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/customer-app/package-lock.json
          git commit -m "fix: refresh customer dependency lock"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
