name: S10 Bootstrap Validation

on:
  push:
    branches: [ codex/s10-ui-auth-foundation ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: github.event_name == 'push' || github.head_ref == 'codex/s10-ui-auth-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout S10 branch
        uses: actions/checkout@v4
        with:
          ref: codex/s10-ui-auth-foundation
          fetch-depth: 0

      - name: Apply reviewed S10 payload
        run: python .s10-bootstrap.py

      - name: Apply demonstrated source corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          otp = Path('apps/customer-app/src/auth/otp-auth.ts')
          source = otp.read_text()
          source = source.replace(
              ": await supabase.auth.resend({ type: 'email', email: identifier });",
              ": await supabase.auth.signInWithOtp({ email: identifier, options: { shouldCreateUser: true, data: { role: 'CUSTOMER' } } });",
          )
          otp.write_text(source)

          tabs = Path('apps/customer-app/src/components/app-tabs.tsx')
          source = tabs.read_text().replace(
              '<AppIcon name={tab.icon} color={color} size={size} />',
              "<AppIcon name={tab.icon} color={typeof color === 'string' ? color : theme.primary} size={size} />",
          )
          tabs.write_text(source)

          test = Path('apps/customer-app/src/auth/__tests__/otp-auth.test.ts')
          source = test.read_text()
          source = source.replace("    mockResend.mockResolvedValue({ error: null });\n", '')
          source = source.replace(
              "    expect(mockResend).toHaveBeenCalledWith({ type: 'email', email });",
              '    expect(mockSignInWithOtp).toHaveBeenLastCalledWith(expect.objectContaining({ email }));',
          )
          test.write_text(source)
          PY

      - name: Remove bootstrap artifacts
        run: rm -rf .s10-bootstrap.py .s10-payload .github/workflows/s10-bootstrap.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh customer dependency lock
        working-directory: apps/customer-app
        run: |
          npm pkg set 'devDependencies.@react-native/jest-preset=^0.85.0'
          npm pkg set 'devDependencies.typescript=~5.9.3'
          npm pkg delete jest
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate customer app
        working-directory: apps/customer-app
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test:s10

      - name: Validate merchant and captain app
        working-directory: apps/merchant-captain-app
        run: |
          npm ci
          npm run typecheck
          npm run lint

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Validate affected backend services and migrations
        working-directory: backend
        run: ./gradlew :api-gateway:test :provider-service:test --no-daemon

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No S10 changes produced"; exit 1; }
          git commit -m "feat(customer): implement S10 UI and OTP foundation"
          git push origin HEAD:codex/s10-ui-auth-foundation
