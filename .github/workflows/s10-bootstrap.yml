name: S10 Bootstrap Validation

on:
  push:
    branches: [ codex/s10-ui-auth-foundation ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: github.event_name == 'push' || github.head_ref == 'codex/s10-ui-auth-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout S10 branch
        uses: actions/checkout@v4
        with:
          ref: codex/s10-ui-auth-foundation
          fetch-depth: 0

      - name: Apply reviewed S10 payload
        run: python .s10-bootstrap.py

      - name: Apply demonstrated source corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          otp = Path('apps/customer-app/src/auth/otp-auth.ts')
          source = otp.read_text()
          source = source.replace(
              ": await supabase.auth.resend({ type: 'email', email: identifier });",
              ": await supabase.auth.signInWithOtp({ email: identifier, options: { shouldCreateUser: true, data: { role: 'CUSTOMER' } } });",
          )
          otp.write_text(source)

          tabs = Path('apps/customer-app/src/components/app-tabs.tsx')
          source = tabs.read_text().replace(
              '<AppIcon name={tab.icon} color={color} size={size} />',
              "<AppIcon name={tab.icon} color={typeof color === 'string' ? color : theme.primary} size={size} />",
          )
          tabs.write_text(source)

          test = Path('apps/customer-app/src/auth/__tests__/otp-auth.test.ts')
          source = test.read_text()
          source = source.replace(
              "jest.mock('@/utils/supabase', () => ({ supabase: { auth: { signInWithOtp: mockSignInWithOtp, verifyOtp: mockVerifyOtp, resend: mockResend } } }));",
              "jest.mock('@/utils/supabase', () => ({ supabase: { auth: { signInWithOtp: (...args: unknown[]) => mockSignInWithOtp(...args), verifyOtp: (...args: unknown[]) => mockVerifyOtp(...args), resend: (...args: unknown[]) => mockResend(...args) } } }));",
          )
          source = source.replace("    mockResend.mockResolvedValue({ error: null });\n", '')
          source = source.replace(
              "    expect(mockResend).toHaveBeenCalledWith({ type: 'email', email });",
              '    expect(mockSignInWithOtp).toHaveBeenLastCalledWith(expect.objectContaining({ email }));',
          )
          test.write_text(source)

          layout = Path('apps/customer-app/src/app/_layout.tsx')
          source = layout.read_text().replace('        <Stack.Screen name="order-protection" options={{ presentation: \'modal\' }} />\n', '')
          layout.write_text(source)

          for locale_path in [
              Path('apps/customer-app/src/i18n/s10-en.json'),
              Path('apps/customer-app/src/i18n/s10-hi.json'),
              Path('apps/customer-app/src/i18n/te.json'),
          ]:
              data = json.loads(locale_path.read_text())
              def remove_keys(value):
                  if isinstance(value, dict):
                      value.pop('orderProtection', None)
                      value.pop('orderProtectionHint', None)
                      for child in value.values():
                          remove_keys(child)
                  elif isinstance(value, list):
                      for child in value:
                          remove_keys(child)
              remove_keys(data)
              locale_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Remove out-of-scope later-sprint changes
        run: |
          rm -rf apps/customer-app/src/security
          rm -f apps/customer-app/src/app/order-protection.tsx
          rm -f apps/customer-app/src/context/ProtectionContext.tsx
          git checkout origin/main -- backend
          git clean -fd backend

      - name: Show remaining scope references
        run: |
          echo '--- Profile screen ---'
          sed -n '1,220p' apps/customer-app/src/screens/profile-screen.tsx
          echo '--- Remaining protection references ---'
          grep -RInE 'Protection|order-protection|orderProtection|expo-local-authentication' apps/customer-app/src apps/customer-app/package.json || true

      - name: Remove bootstrap artifacts
        run: rm -rf .s10-bootstrap.py .s10-payload .github/workflows/s10-bootstrap.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh customer dependency lock
        working-directory: apps/customer-app
        run: |
          npm pkg set 'devDependencies.@react-native/jest-preset=^0.85.0'
          npm pkg set 'devDependencies.typescript=~5.9.3'
          npm pkg delete jest
          npm pkg delete dependencies.expo-local-authentication
          npm pkg set 'scripts.test:s10=jest --runInBand src/auth/__tests__ src/navigation/__tests__ src/i18n/__tests__/s10-i18n.test.ts'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate customer app
        working-directory: apps/customer-app
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test:s10

      - name: Validate merchant and captain app
        working-directory: apps/merchant-captain-app
        run: |
          npm ci
          npm run typecheck
          npm run lint

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No S10 changes produced"; exit 1; }
          git commit -m "feat(customer): implement S10 UI and OTP foundation"
          git push origin HEAD:codex/s10-ui-auth-foundation
