name: Barcode Scanner E2E

on:
  pull_request:
    paths:
      - 'apps/merchant-captain-app/**'
      - 'backend/catalog-service/**'
      - 'scripts/check-barcode-e2e.py'
      - '.github/workflows/barcode-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'apps/merchant-captain-app/**'
      - 'backend/catalog-service/**'
      - 'scripts/check-barcode-e2e.py'
      - '.github/workflows/barcode-e2e.yml'
  workflow_dispatch:

jobs:
  barcode-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
          cache-dependency-path: apps/merchant-captain-app/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install merchant app dependencies
        working-directory: apps/merchant-captain-app
        run: npm ci

      - name: Run barcode scanner mobile contracts
        working-directory: apps/merchant-captain-app
        run: |
          npm run typecheck
          npm run lint
          npm test -- src/__tests__/barcode-scanner.test.ts

      - name: Run barcode catalog and billing tests
        working-directory: backend
        run: ./gradlew :catalog-service:test --tests 'com.pawsnearme.catalogservice.service.CatalogServiceTests' --no-daemon

      - name: Validate complete barcode journey wiring
        run: python3 scripts/check-barcode-e2e.py

      - name: Validate migration uniqueness
        run: bash scripts/check-production-hardening.sh
