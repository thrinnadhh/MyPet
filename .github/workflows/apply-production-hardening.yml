name: Apply production hardening

on:
  workflow_dispatch:
  push:
    branches:
      - security/s24-s28-production-hardening

permissions:
  contents: write
  actions: read

concurrency:
  group: production-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[hardening-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: security/s24-s28-production-hardening
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            apps/customer-app/package-lock.json
            apps/merchant-captain-app/package-lock.json

      - name: Reconstruct and apply codemod
        run: |
          cat scripts/.hardening/part*.b64 | base64 --decode > scripts/apply_production_hardening.py
          python3 -m py_compile scripts/apply_production_hardening.py
          python3 scripts/apply_production_hardening.py
          rm -rf scripts/.hardening

      - name: Refresh merchant dependency lock
        working-directory: apps/merchant-captain-app
        run: npm install --package-lock-only --ignore-scripts

      - name: Backend verification
        working-directory: backend
        env:
          INTERNAL_API_SECRET: ci-internal-service-secret
        run: |
          chmod +x gradlew
          ./gradlew clean test --no-daemon

      - name: Customer app verification
        working-directory: apps/customer-app
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test

      - name: Merchant and captain app verification
        working-directory: apps/merchant-captain-app
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test

      - name: Static production hardening gates
        run: bash scripts/check-production-hardening.sh

      - name: Capture failure diagnostics
        if: failure()
        run: |
          git status --short > hardening-status.txt
          git diff --stat >> hardening-status.txt
          find backend -path '*/build/test-results/test/*.xml' -type f -print > hardening-test-files.txt || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-hardening-diagnostics-${{ github.run_attempt }}
          path: |
            hardening-status.txt
            hardening-test-files.txt
            backend/**/build/reports/tests/test/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit verified remediation
        run: |
          git config user.name "mypet-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No remediation changes to commit."
            exit 0
          fi
          git commit -m "fix: apply Sprints 24-28 production hardening [hardening-bot]"
          git push origin HEAD:security/s24-s28-production-hardening
