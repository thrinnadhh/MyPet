name: Apply Cashfree Configuration Migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Replace remaining deploy-time Razorpay configuration
        run: |
          python - <<'PY'
          from pathlib import Path

          replicas = Path('infra/docker-compose.replicas.yml')
          text = replicas.read_text()
          text = text.replace('    RAZORPAY_SANDBOX_MODE: "false"\n', '')
          marker = '      SPRING_FLYWAY_TABLE: flyway_schema_history_payment\n'
          cashfree = '''      CASHFREE_SANDBOX_MODE: "false"\n      CASHFREE_API_VERSION: "2025-01-01"\n      CASHFREE_CLIENT_ID: ${CASHFREE_CLIENT_ID:?CASHFREE_CLIENT_ID must be set}\n      CASHFREE_CLIENT_SECRET: ${CASHFREE_CLIENT_SECRET:?CASHFREE_CLIENT_SECRET must be set}\n      CASHFREE_WEBHOOK_SECRET: ${CASHFREE_WEBHOOK_SECRET:-}\n      PAYMENT_CHECKOUT_TOKEN_SECRET: ${PAYMENT_CHECKOUT_TOKEN_SECRET:?PAYMENT_CHECKOUT_TOKEN_SECRET must be set}\n'''
          if 'CASHFREE_CLIENT_ID:' not in text:
              if marker not in text:
                  raise SystemExit('payment-service marker not found in replicas compose')
              text = text.replace(marker, marker + cashfree)
          replicas.write_text(text)

          k8s = Path('infra/k8s/backend-services.yaml')
          text = k8s.read_text()
          replacements = {
              'RAZORPAY_KEY_ID': 'CASHFREE_CLIENT_ID',
              'RAZORPAY_KEY_SECRET': 'CASHFREE_CLIENT_SECRET',
              'RAZORPAY_WEBHOOK_SECRET': 'CASHFREE_WEBHOOK_SECRET',
              'RAZORPAY_SANDBOX_MODE': 'CASHFREE_SANDBOX_MODE',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          if "  CASHFREE_API_VERSION: '2025-01-01'" not in text:
              config_marker = "  GATEWAY_TRUST_ENABLED: 'true'\n"
              if config_marker not in text:
                  raise SystemExit('Kubernetes config marker not found')
              text = text.replace(
                  config_marker,
                  config_marker + "  CASHFREE_API_VERSION: '2025-01-01'\n  CASHFREE_SANDBOX_MODE: 'false'\n",
              )
          k8s.write_text(text)

          check = Path('scripts/check-compose-config.sh')
          text = check.read_text()
          text = text.replace('RAZORPAY_SANDBOX_MODE', 'CASHFREE_SANDBOX_MODE')
          text = text.replace('RAZORPAY_KEY_ID', 'CASHFREE_CLIENT_ID')
          text = text.replace('RAZORPAY_KEY_SECRET', 'CASHFREE_CLIENT_SECRET')
          text = text.replace('RAZORPAY_WEBHOOK_SECRET', 'CASHFREE_CLIENT_SECRET')
          check.write_text(text)
          PY
      - name: Commit configuration migration
        run: |
          if git diff --quiet -- infra/docker-compose.replicas.yml infra/k8s/backend-services.yaml scripts/check-compose-config.sh; then
            echo "Cashfree configuration is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/docker-compose.replicas.yml infra/k8s/backend-services.yaml scripts/check-compose-config.sh
          git commit -m "migrate production deployment configuration to Cashfree"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
