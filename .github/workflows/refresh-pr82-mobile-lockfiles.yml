name: Refresh PR82 Mobile Lockfiles

on:
  push:
    branches:
      - agent/production-readiness-integration
    paths:
      - .github/workflows/refresh-pr82-mobile-lockfiles.yml
      - apps/customer-app/package.json
      - apps/merchant-captain-app/package.json
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/refresh-pr82-mobile-lockfiles.yml
      - apps/customer-app/package.json
      - apps/merchant-captain-app/package.json

permissions:
  contents: write

concurrency:
  group: refresh-pr82-mobile-lockfiles
  cancel-in-progress: true

jobs:
  refresh-lockfiles:
    if: ${{ github.event_name == 'push' || github.head_ref == 'agent/production-readiness-integration' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-readiness-integration
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: |
            apps/customer-app/package-lock.json
            apps/merchant-captain-app/package-lock.json

      - name: Regenerate customer lockfile and verify audit
        working-directory: apps/customer-app
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Regenerate operational lockfile and verify audit
        working-directory: apps/merchant-captain-app
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Commit regenerated lockfiles
        run: |
          git add apps/customer-app/package-lock.json apps/merchant-captain-app/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already match package overrides."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: refresh mobile lockfiles for js-yaml advisory"
          git push origin HEAD:agent/production-readiness-integration
