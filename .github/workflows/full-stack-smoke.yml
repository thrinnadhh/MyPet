name: Full Stack Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "infra/**"
      - "imp files/**"
      - "scripts/**"
      - ".github/workflows/full-stack-smoke.yml"

permissions:
  contents: read

concurrency:
  group: full-stack-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package database source inventory
        run: |
          mkdir -p build/reports
          tar -czf build/reports/database-source-inventory.tgz \
            backend/*/src/main/resources/db/migration \
            backend/*/src/main/kotlin \
            infra \
            "imp files" 2>/dev/null || true
          find backend -path '*/src/main/resources/db/migration/*.sql' -print \
            | sort > build/reports/migration-files.txt
          find "imp files" -maxdepth 1 -type f -print 2>/dev/null \
            | sort > build/reports/legacy-bootstrap-files.txt || true

      - name: Upload database source inventory
        uses: actions/upload-artifact@v4
        with:
          name: database-source-inventory-${{ github.run_id }}
          retention-days: 2
          path: build/reports/*

  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PARALLEL_LIMIT: "3"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run complete backend and Docker validation
        run: bash scripts/test-full-stack.sh

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-validation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/reports/*.md
            backend/*/build/reports/tests/test/**
            backend/*/build/test-results/test/**
