name: Expo SDK 56 Lockfile Refresh

on:
  pull_request:
    paths:
      - ".github/workflows/expo-sdk56-lockfile-refresh.yml"
      - "apps/customer-app/package.json"
      - "apps/customer-app/package-lock.json"

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: apps/customer-app/package-lock.json

      - name: Generate and validate Expo-compatible package files
        working-directory: apps/customer-app
        run: |
          npm ci
          npx expo install \
            @expo/ui@~56.0.25 \
            expo@~56.0.19 \
            expo-constants@~56.0.23 \
            expo-file-system@~56.0.9 \
            expo-image-picker@~56.0.23 \
            expo-location@~56.0.23 \
            expo-notifications@~56.0.23 \
            expo-router@~56.2.18 \
            expo-symbols@~56.0.7 \
            --npm
          npx --yes expo-doctor@1.20.1
          npm run typecheck
          npm run lint
          npm run test:coverage

      - name: Commit generated package files and remove generator
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/customer-app/package.json apps/customer-app/package-lock.json
          git rm .github/workflows/expo-sdk56-lockfile-refresh.yml
          git commit -m "chore: align customer Expo SDK 56 patches"
          git push origin "HEAD:$HEAD_BRANCH"
