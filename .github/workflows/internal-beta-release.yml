name: MyPet Internal Beta Release

on:
  pull_request:
    paths:
      - "release/v0.9.0-beta.1.json"
      - "scripts/validate-internal-beta.py"
      - "scripts/validate-p2b-device-qa.py"
      - "scripts/check-p2b-connected-e2e.py"
      - "scripts/verify-mobile-npm-audit.py"
      - "qa/**"
      - "apps/customer-app/app.json"
      - "apps/customer-app/eas.json"
      - "apps/customer-app/package.json"
      - "apps/customer-app/package-lock.json"
      - "apps/merchant-captain-app/app.json"
      - "apps/merchant-captain-app/app.config.js"
      - "apps/merchant-captain-app/eas.json"
      - "apps/merchant-captain-app/package.json"
      - "apps/merchant-captain-app/package-lock.json"
      - ".github/workflows/internal-beta-release.yml"
  workflow_dispatch:
    inputs:
      authorize_release:
        description: Enforce all physical evidence, build artifacts and release authorization
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate internal beta configuration
        run: python scripts/validate-internal-beta.py
      - name: Validate release authorization
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_release }}
        run: python scripts/validate-internal-beta.py --release

  build-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm
          cache-dependency-path: |
            apps/customer-app/package-lock.json
            apps/merchant-captain-app/package-lock.json
      - name: Validate customer Expo configuration
        working-directory: apps/customer-app
        run: |
          npm ci
          python3 ../../scripts/verify-mobile-npm-audit.py .
          npx --yes expo-doctor@1.20.1
          npx expo config --type public --json >/tmp/customer-expo-config.json
      - name: Validate operational and merchant Expo configurations
        working-directory: apps/merchant-captain-app
        run: |
          npm ci
          python3 ../../scripts/verify-mobile-npm-audit.py .
          npx --yes expo-doctor@1.20.1
          MYPET_APP_VARIANT=operations EXPO_PUBLIC_APP_VARIANT=operations npx expo config --type public --json >/tmp/operations-expo-config.json
          MYPET_APP_VARIANT=merchant EXPO_PUBLIC_APP_VARIANT=merchant npx expo config --type public --json >/tmp/merchant-expo-config.json
          node - <<'NODE'
          const fs = require('node:fs');
          const merchant = JSON.parse(fs.readFileSync('/tmp/merchant-expo-config.json', 'utf8'));
          if (merchant.name !== 'MyPet Merchant') throw new Error(`Unexpected merchant app name: ${merchant.name}`);
          if (merchant.android?.package !== 'com.mypet.merchant') throw new Error(`Unexpected merchant package: ${merchant.android?.package}`);
          if (merchant.extra?.appVariant !== 'merchant') throw new Error(`Unexpected merchant app variant: ${merchant.extra?.appVariant}`);
          const blocked = new Set(merchant.android?.blockedPermissions ?? []);
          for (const permission of ['android.permission.ACCESS_BACKGROUND_LOCATION', 'android.permission.FOREGROUND_SERVICE_LOCATION']) {
            if (!blocked.has(permission)) throw new Error(`Merchant build must block ${permission}`);
          }
          NODE

  release-intentionally-blocked:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Release tooling may merge, but tag/distribution remain blocked until the fail-closed manifest is explicitly authorized with evidence."
