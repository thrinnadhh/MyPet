name: Java & Mobile CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        working-directory: backend
        run: ./gradlew clean test --no-daemon

      - name: Check Generated Artifacts
        run: scripts/check-no-generated-artifacts.sh

  mobile-validate:
    name: Mobile App Lint & Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
          cache-dependency-path: |
            apps/customer-app/package-lock.json
            apps/merchant-captain-app/package-lock.json

      - name: Validate Customer App
        run: |
          cd apps/customer-app
          npm ci
          npm run typecheck
          npm run lint
          npm test -- --runInBand

      - name: Validate Merchant/Captain App
        run: |
          cd apps/merchant-captain-app
          npm ci
          npm run typecheck
          npm run lint
