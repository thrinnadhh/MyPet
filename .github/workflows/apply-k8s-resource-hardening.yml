name: Apply Kubernetes resource hardening

on:
  workflow_dispatch:
  push:
    branches:
      - agent/s26-k8s-resources

permissions:
  contents: write

concurrency:
  group: s26-k8s-resource-hardening
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[k8s-hardening-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/s26-k8s-resources
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deployment hardening
        run: |
          python3 -m py_compile scripts/apply_k8s_resource_hardening.py
          python3 scripts/apply_k8s_resource_hardening.py

      - name: Parse Kubernetes manifests
        run: |
          python3 -m pip install --disable-pip-version-check pyyaml==6.0.2
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          paths = [
              Path('infra/k8s/backend-services.yaml'),
              Path('infra/k8s/hpa-pdb.yaml'),
              Path('infra/k8s/network-policy.yaml'),
          ]
          documents = []
          for path in paths:
              parsed = [doc for doc in yaml.safe_load_all(path.read_text()) if doc]
              if not parsed:
                  raise SystemExit(f'No Kubernetes resources parsed from {path}')
              documents.extend(parsed)
          deployments = [doc for doc in documents if doc.get('kind') == 'Deployment']
          if len(deployments) != 13:
              raise SystemExit(f'Expected 13 deployments, found {len(deployments)}')
          for deployment in deployments:
              name = deployment['metadata']['name']
              pod_spec = deployment['spec']['template']['spec']
              container = pod_spec['containers'][0]
              requests = container.get('resources', {}).get('requests', {})
              if not requests.get('cpu') or not requests.get('memory'):
                  raise SystemExit(f'{name} is missing CPU/memory requests')
              if not any(m.get('mountPath') == '/tmp' for m in container.get('volumeMounts', [])):
                  raise SystemExit(f'{name} is missing /tmp volume mount')
              if not any(v.get('name') == 'tmp' for v in pod_spec.get('volumes', [])):
                  raise SystemExit(f'{name} is missing tmp volume')
          print(f'Validated {len(documents)} Kubernetes resources')
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify backend and static gates
        run: |
          cd backend
          ./gradlew clean test --no-daemon
          cd ..
          bash scripts/check-production-hardening.sh

      - name: Commit verified manifests
        run: |
          git config user.name "mypet-k8s-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git restore --source=HEAD -- .github/workflows
          git add infra/k8s/backend-services.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(s26): add backend resource requests and runtime hardening [k8s-hardening-bot]"
          git push origin HEAD:agent/s26-k8s-resources
