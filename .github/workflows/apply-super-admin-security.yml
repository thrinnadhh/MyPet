name: Apply super-admin security

on:
  workflow_dispatch:
  push:
    branches:
      - agent/s25-super-admin-auth

permissions:
  contents: write

concurrency:
  group: s25-super-admin-security
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[admin-security-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/s25-super-admin-auth
          fetch-depth: 0

      - name: Apply HTML integration
        run: python3 scripts/apply_super_admin_security.py

      - name: Verify JavaScript syntax
        run: |
          node --check apps/super-admin-web/app.js
          node --check apps/super-admin-web/config.js
          node --check apps/super-admin-web/secure-admin.js

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify backend
        working-directory: backend
        run: ./gradlew clean test --no-daemon

      - name: Commit verified HTML integration
        run: |
          git config user.name "mypet-admin-security-bot"
          git config user.email "actions@users.noreply.github.com"
          git restore --source=HEAD -- .github/workflows
          git add apps/super-admin-web/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(s25): load authenticated super-admin security layer [admin-security-bot]"
          git push origin HEAD:agent/s25-super-admin-auth
