name: Refresh PR82 Customer Lockfile

on:
  push:
    branches:
      - agent/production-readiness-integration
    paths:
      - "apps/customer-app/package.json"
      - ".github/workflows/refresh-pr82-customer-lock.yml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-readiness-integration

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: apps/customer-app/package-lock.json

      - name: Regenerate customer lockfile
        working-directory: apps/customer-app
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify #83 dependency repair and clean install
        working-directory: apps/customer-app
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const key = 'node_modules/@istanbuljs/load-nyc-config/node_modules/js-yaml';
          const entry = lock.packages?.[key];
          if (!entry || entry.version !== '3.15.1') {
            throw new Error(`Expected ${key} at 3.15.1, got ${entry?.version || 'missing'}`);
          }
          NODE
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- apps/customer-app/package-lock.json; then
            echo "Customer lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/customer-app/package-lock.json
          git commit -m "fix: align PR82 customer lockfile with #83"
          git push origin HEAD:agent/production-readiness-integration
