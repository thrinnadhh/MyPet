name: P2B Device QA Evidence

on:
  workflow_dispatch:
    inputs:
      release_gate:
        description: Require every physical-device check to pass
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "qa/p2b-device-qa-matrix.json"
      - "scripts/validate-p2b-device-qa.py"
      - "docs/qa/**"
      - ".github/workflows/p2b-device-qa.yml"
      - "apps/customer-app/src/**"
      - "apps/merchant-captain-app/src/**"

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact workflow commit without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git -c http.extraheader="AUTHORIZATION: bearer $GH_TOKEN" \
            fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Validate matrix structure
        run: python3 scripts/validate-p2b-device-qa.py
      - name: Enforce release evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate }}
        run: python3 scripts/validate-p2b-device-qa.py --release

  mobile-accessibility-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact workflow commit without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git -c http.extraheader="AUTHORIZATION: bearer $GH_TOKEN" \
            fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Verify built-in Node runtime
        run: |
          node --version
          npm --version
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 20 || (major === 20 && minor < 19)) process.exit(1)'
      - name: Customer accessibility contracts
        working-directory: apps/customer-app
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test -- --runInBand src/__tests__/accessibility-device-contract.test.ts
      - name: Operational accessibility contracts
        working-directory: apps/merchant-captain-app
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test -- src/__tests__/accessibility-device-contract.test.ts
