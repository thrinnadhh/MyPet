name: Apply linked account schema fix

on:
  workflow_dispatch:
  push:
    branches:
      - agent/s24-linked-account-schema

permissions:
  contents: write

concurrency:
  group: s24-linked-account-schema
  cancel-in-progress: true

jobs:
  apply-and-verify:
    # This workflow exists only on the isolated remediation branch and is deleted before merge.
    if: ${{ !contains(github.event.head_commit.message || '', '[linked-account-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/s24-linked-account-schema
          fetch-depth: 0

      - name: Apply schema correction
        run: python3 scripts/apply_linked_account_schema_fix.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify backend
        working-directory: backend
        run: ./gradlew clean test --no-daemon

      - name: Commit verified correction
        run: |
          git config user.name "mypet-linked-account-bot"
          git config user.email "actions@users.noreply.github.com"
          git restore --source=HEAD -- .github/workflows
          git add backend/payment-service/src/main/kotlin/com/pawsnearme/paymentservice/model/Models.kt
          git add backend/payment-service/src/main/kotlin/com/pawsnearme/paymentservice/service/PaymentService.kt
          git add backend/payment-service/src/test/kotlin/com/pawsnearme/paymentservice/service/PaymentServiceTests.kt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(s24): align linked-account persistence and minimize bank data [linked-account-bot]"
          git push origin HEAD:agent/s24-linked-account-schema
