name: Harden Cashfree Service Migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply service hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/payment-service/src/main/kotlin/com/pawsnearme/paymentservice/service/CashfreeGatewayService.kt')
          text = path.read_text()
          text = text.replace(
              '@field:Pattern(regexp = "ORDER_PAYMENT|APPOINTMENT_PAYMENT")',
              '@field:Pattern(regexp = "ORDER_PAYMENT")',
          )
          old = '        require(request.amount > BigDecimal.ZERO) { "Payment amount must be greater than zero" }\n        if (request.transactionType == "ORDER_PAYMENT") {'
          new = '        require(request.transactionType == "ORDER_PAYMENT") { "Cashfree order initiation currently supports order payments only" }\n        require(request.amount > BigDecimal.ZERO) { "Payment amount must be greater than zero" }\n        if (request.transactionType == "ORDER_PAYMENT") {'
          if old not in text:
              raise SystemExit('Cashfree reference validation marker not found')
          text = text.replace(old, new)
          text = text.replace(
              '${event["event_time"].orEmpty()}',
              '${event["event_time"]?.toString().orEmpty()}',
          )
          old_idempotency = '''        val eventUuid = runCatching { UUID.fromString(eventKey) }
            .getOrElse { UUID.nameUUIDFromBytes(eventKey.toByteArray(StandardCharsets.UTF_8)) }
        if (!idempotencyService.checkAndRecord(eventUuid)) return false

        val transaction = transactionRepository.findByGatewayTransactionId(orderId)'''
          new_idempotency = '''        val eventUuid = runCatching { UUID.fromString(eventKey) }
            .getOrElse { UUID.nameUUIDFromBytes(eventKey.toByteArray(StandardCharsets.UTF_8)) }

        val transaction = transactionRepository.findByGatewayTransactionId(orderId)'''
          if old_idempotency not in text:
              raise SystemExit('Cashfree idempotency marker not found')
          text = text.replace(old_idempotency, new_idempotency)
          validation_marker = '''        validateWebhookAmount(transaction, order, payment)

        val paymentStatus = payment?.get("payment_status")?.toString()?.uppercase()'''
          validation_replacement = '''        validateWebhookAmount(transaction, order, payment)
        if (!idempotencyService.checkAndRecord(eventUuid)) return false

        val paymentStatus = payment?.get("payment_status")?.toString()?.uppercase()'''
          if validation_marker not in text:
              raise SystemExit('Cashfree webhook validation marker not found')
          text = text.replace(validation_marker, validation_replacement)
          path.write_text(text)

          extension = Path('backend/payment-service/src/main/kotlin/com/pawsnearme/paymentservice/service/CashfreeValueExtensions.kt')
          if extension.exists():
              extension.unlink()
          PY
      - name: Commit hardening
        run: |
          if git diff --quiet; then
            echo "Cashfree service hardening is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A backend/payment-service/src/main/kotlin/com/pawsnearme/paymentservice/service
          git commit -m "harden Cashfree reference and webhook validation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
