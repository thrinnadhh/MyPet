server:
  port: ${SERVER_PORT:8088}

# Notification template registry — message patterns keyed by templateCode.
# Use {referenceId} as the substitution placeholder.
# Adding a new reminder type only requires a new entry here, no code change.
notification:
  templates:
    APPOINTMENT_T24H: "Your appointment is tomorrow! Ref: {referenceId}"
    APPOINTMENT_T1H: "Your appointment is in 1 hour! Ref: {referenceId}"
    ORDER_DELIVERED: "Your order has been delivered! Order: {referenceId}"
    ORDER_PLACED: "Your order has been placed successfully! Order: {referenceId}"
    MERCHANT_ORDER_ALERT: "New order received! Order: {referenceId}"
    VACCINATION_DUE: "Vaccination reminder for your pet. Ref: {referenceId}"
    VACCINATION_DUE_7D: "Vaccination due in 7 days. Ref: {referenceId}"
    VACCINATION_DUE_1D: "Vaccination due tomorrow. Ref: {referenceId}"
    CHAT_MESSAGE: "New message: {referenceId}"
  delivery:
    mode: ${NOTIFICATION_DELIVERY_MODE:LOGGED_DEV}
  email:
    # Keep disabled until sender domains, provider keys and all template IDs are configured.
    enabled: ${TRANSACTIONAL_EMAIL_ENABLED:false}
    max-attempts: ${TRANSACTIONAL_EMAIL_MAX_ATTEMPTS:5}
    retry-interval-ms: ${TRANSACTIONAL_EMAIL_RETRY_INTERVAL_MS:60000}
    msg91:
      auth-key: ${MSG91_AUTH_KEY:}
      domain: ${MSG91_EMAIL_DOMAIN:}
      from-email: ${MSG91_EMAIL_FROM:}
      from-name: ${MSG91_EMAIL_FROM_NAME:MyPet}
      # Free-plan routing ceiling. Override if the commercial plan/quota changes.
      monthly-limit: ${MSG91_EMAIL_MONTHLY_LIMIT:5000}
      templates:
        ORDER_PLACED: ${MSG91_EMAIL_TEMPLATE_ORDER_PLACED:}
        ORDER_DELIVERED: ${MSG91_EMAIL_TEMPLATE_ORDER_DELIVERED:}
        APPOINTMENT_BOOKED: ${MSG91_EMAIL_TEMPLATE_APPOINTMENT_BOOKED:}
    brevo:
      api-key: ${BREVO_API_KEY:}
      from-email: ${BREVO_EMAIL_FROM:}
      from-name: ${BREVO_EMAIL_FROM_NAME:MyPet}
      templates:
        ORDER_PLACED: ${BREVO_EMAIL_TEMPLATE_ORDER_PLACED:}
        ORDER_DELIVERED: ${BREVO_EMAIL_TEMPLATE_ORDER_DELIVERED:}
        APPOINTMENT_BOOKED: ${BREVO_EMAIL_TEMPLATE_APPOINTMENT_BOOKED:}

spring:
  application:
    name: notification-service
  datasource:
    url: ${SUPAVISOR_DB_URL:${DB_URL:jdbc:postgresql://localhost:5433/pawsnearme?currentSchema=notifications,appointments,catalog,public&stringtype=unspecified}}
    username: ${DB_USERNAME:notification_service_role}
    password: ${DB_PASSWORD:notification_service_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000
      leak-detection-threshold: 10000
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  flyway:
    enabled: true
    baseline-on-migrate: true
    default-schema: notifications
    schemas: notifications
    create-schemas: true
    user: ${FLYWAY_DB_USERNAME:postgres}
    password: ${FLYWAY_DB_PASSWORD:postgres}
  jpa:
    properties:
      hibernate:
        default_schema: notifications
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: ${JPA_SHOW_SQL:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

gateway:
  trust:
    enabled: ${GATEWAY_TRUST_ENABLED:false}
    secret: ${GATEWAY_SECRET:dev-secret-change-in-production}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: false

# Gateway trust boundary — set GATEWAY_SECRET env var to match api-gateway
# Enable in staging/production; leave disabled in local dev

provider:
  service:
    url: ${PROVIDER_SERVICE_URL:http://localhost:8081}

internal:
  api:
    secret: ${INTERNAL_API_SECRET}
