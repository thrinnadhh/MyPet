server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: payment-service
  datasource:
    url: ${SUPAVISOR_DB_URL:${DB_URL:jdbc:postgresql://localhost:5433/pawsnearme?currentSchema=payments,orders,appointments,captains,providers,public&stringtype=unspecified}}
    username: ${DB_USERNAME:payment_service_role}
    password: ${DB_PASSWORD:payment_service_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
  flyway:
    enabled: true
    baseline-on-migrate: true
    default-schema: payments
    schemas: payments
    create-schemas: true
    user: ${FLYWAY_DB_USERNAME:postgres}
    password: ${FLYWAY_DB_PASSWORD:postgres}
  jpa:
    properties:
      hibernate:
        default_schema: payments
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: ${JPA_SHOW_SQL:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: false

# Gateway trust boundary — set GATEWAY_SECRET env var to match api-gateway
# Enable in staging/production; leave disabled in local dev
gateway:
  trust:
    enabled: ${GATEWAY_TRUST_ENABLED:false}
    secret: ${GATEWAY_SECRET:dev-secret-change-in-production}
