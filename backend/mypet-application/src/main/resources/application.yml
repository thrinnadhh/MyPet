server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

spring:
  application:
    name: mypet-application
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
    consumer:
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  jpa:
    open-in-view: false

# The provider bounded context retains gRPC source compatibility for rollback,
# but the modular monolith communicates in-process and must not bind a legacy
# network listener. The grpc-spring server starter treats -1 as disabled.
grpc:
  server:
    port: ${GRPC_PORT:-1}

# Module-owned settings are promoted here because dependency JAR
# application.yml files are not merged into the executable's Environment.
order:
  auto-complete:
    hours-after-delivery: ${ORDER_AUTO_COMPLETE_HOURS:1}
  online-payments-enabled: ${ORDER_ONLINE_PAYMENTS_ENABLED:false}
  case-evidence:
    dir: ${ORDER_CASE_EVIDENCE_DIR:./private-case-evidence}
    public-base-url: ${ORDER_CASE_EVIDENCE_PUBLIC_BASE_URL:http://localhost:8080}

appointment:
  medical-documents:
    dir: ${APPOINTMENT_MEDICAL_DOCUMENTS_DIR:./private-medical-documents}
    public-base-url: ${APPOINTMENT_MEDICAL_DOCUMENTS_PUBLIC_BASE_URL:http://localhost:8080}

provider:
  public-base-url: ${PROVIDER_PUBLIC_BASE_URL:http://localhost:8080}

internal:
  api:
    secret: ${INTERNAL_API_SECRET:}

storage:
  medical-reports:
    bucket: ${MEDICAL_REPORTS_BUCKET:}
    region: ${MEDICAL_REPORTS_REGION:${AWS_REGION:ap-south-1}}
    url-ttl-seconds: ${MEDICAL_REPORTS_URL_TTL_SECONDS:900}
    access-key: ${MEDICAL_REPORTS_ACCESS_KEY:}
    secret-key: ${MEDICAL_REPORTS_SECRET_KEY:}

security:
  bank-data:
    encryption-key: ${BANK_DATA_ENCRYPTION_KEY:}

chat:
  uploads:
    dir: ${CHAT_UPLOAD_DIR:./uploads/chat}
  public-base-url: ${CHAT_PUBLIC_BASE_URL:http://localhost:8080}

notification:
  templates:
    APPOINTMENT_T24H: "Your appointment is tomorrow! Ref: {referenceId}"
    APPOINTMENT_T1H: "Your appointment is in 1 hour! Ref: {referenceId}"
    ORDER_DELIVERED: "Your order has been delivered! Order: {referenceId}"
    ORDER_PLACED: "Your order has been placed successfully! Order: {referenceId}"
    MERCHANT_ORDER_ALERT: "New order received! Order: {referenceId}"
    VACCINATION_DUE: "Vaccination reminder for your pet. Ref: {referenceId}"
    VACCINATION_DUE_7D: "Vaccination due in 7 days. Ref: {referenceId}"
    VACCINATION_DUE_1D: "Vaccination due tomorrow. Ref: {referenceId}"
    CHAT_MESSAGE: "New message: {referenceId}"
  delivery:
    mode: ${NOTIFICATION_DELIVERY_MODE:LOGGED_DEV}

# Legacy gateway-trust properties remain resolvable for any module components
# that still bind them, but the filters themselves are excluded in monolith mode.
gateway:
  trust:
    enabled: false
    secret: ${INTERNAL_API_SECRET:}

mypet:
  runtime:
    # Unit tests retain the lightweight application shell. The monolith
    # deployment enables all bounded contexts explicitly in Compose.
    modules-enabled: ${MYPET_MODULES_ENABLED:false}
  edge:
    enabled: ${MYPET_EDGE_ENABLED:false}
    jwt:
      jwk-set-uri: ${SUPABASE_JWT_JWK_SET_URI:https://your-project.supabase.co/rest/v1/auth/keys}
      secret-key: ${SUPABASE_JWT_SECRET:}
      allow-unsigned: ${ALLOW_UNSIGNED_JWT:false}
    cors:
      allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
    rate-limit:
      enabled: ${MYPET_RATE_LIMIT_ENABLED:true}
      replenish-rate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:100}
      burst-capacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:200}
      trust-forwarded-for: ${MYPET_TRUST_FORWARDED_FOR:false}
      max-clients: ${MYPET_RATE_LIMIT_MAX_CLIENTS:20000}
    idempotency:
      enabled: ${MYPET_IDEMPOTENCY_ENABLED:true}
      ttl-seconds: ${MYPET_IDEMPOTENCY_TTL_SECONDS:900}
      max-entries: ${MYPET_IDEMPOTENCY_MAX_ENTRIES:10000}
      max-body-bytes: ${MYPET_IDEMPOTENCY_MAX_BODY_BYTES:1048576}
  database:
    enabled: ${MYPET_DATABASE_ENABLED:false}
    url: ${MYPET_DB_URL:${DB_URL:}}
    username: ${MYPET_DB_USERNAME:${DB_USERNAME:}}
    password: ${MYPET_DB_PASSWORD:${DB_PASSWORD:}}
    maximum-pool-size: ${MYPET_DB_POOL_MAX_SIZE:12}
    minimum-idle: ${MYPET_DB_POOL_MIN_IDLE:2}
    connection-timeout-ms: ${MYPET_DB_CONNECTION_TIMEOUT_MS:5000}
    migrate-on-startup: ${MYPET_FLYWAY_MIGRATE_ON_STARTUP:true}
    connect-retries: ${MYPET_FLYWAY_CONNECT_RETRIES:10}
    lock-retry-count: ${MYPET_FLYWAY_LOCK_RETRY_COUNT:50}
  events:
    # Kafka remains the durable event transport during M9/M10. It is
    # infrastructure, not an independently deployed business service.
    delivery-mode: ${MYPET_EVENT_DELIVERY_MODE:KAFKA_ONLY}
  scheduling:
    role: ${MYPET_SCHEDULING_ROLE:API}
    lock-table: ${MYPET_SCHEDULING_LOCK_TABLE:orders.shedlock}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: MyPet Application
    milestone: M10
    architecture: modular-monolith
