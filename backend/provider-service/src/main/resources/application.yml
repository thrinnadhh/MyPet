server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: provider-service
  datasource:
    url: ${SUPAVISOR_DB_URL:${DB_URL:jdbc:postgresql://localhost:5433/pawsnearme?currentSchema=providers,identity,public&stringtype=unspecified}}
    username: ${DB_USERNAME:provider_service_role}
    password: ${DB_PASSWORD:provider_service_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000
      leak-detection-threshold: 10000
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  flyway:
    enabled: true
    baseline-on-migrate: true
    default-schema: providers
    schemas: providers
    user: ${FLYWAY_DB_USERNAME:postgres}
    password: ${FLYWAY_DB_PASSWORD:postgres}
  jpa:
    properties:
      hibernate:
        default_schema: providers
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: provider-service-reviews
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

grpc:
  server:
    port: ${GRPC_PORT:9091}


gateway:
  trust:
    enabled: ${GATEWAY_TRUST_ENABLED:false}
    secret: ${GATEWAY_SECRET:dev-secret-change-in-production}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
---
# Dev profile: enable SQL logging
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: false

# Gateway trust boundary — set GATEWAY_SECRET env var to match api-gateway
# Enable in staging/production; leave disabled in local dev


provider:
  public-base-url: ${PROVIDER_PUBLIC_BASE_URL:http://localhost:8081}

internal:
  api:
    secret: ${INTERNAL_API_SECRET:dev-internal-secret}


