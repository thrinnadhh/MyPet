server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: review-service
  datasource:
    url: ${SUPAVISOR_DB_URL:${DB_URL:jdbc:postgresql://localhost:5433/pawsnearme?currentSchema=reviews,public&stringtype=unspecified}}
    username: ${DB_USERNAME:review_service_role}
    password: ${DB_PASSWORD:review_service_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000
      leak-detection-threshold: 10000
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  flyway:
    enabled: true
    baseline-on-migrate: true
    default-schema: reviews
    schemas: reviews
    create-schemas: true
    user: ${FLYWAY_DB_USERNAME:postgres}
    password: ${FLYWAY_DB_PASSWORD:postgres}
  jpa:
    properties:
      hibernate:
        default_schema: reviews
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: ${JPA_SHOW_SQL:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}


gateway:
  trust:
    enabled: ${GATEWAY_TRUST_ENABLED:false}
    secret: ${GATEWAY_SECRET:dev-secret-change-in-production}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: false

# Gateway trust boundary — set GATEWAY_SECRET env var to match api-gateway
# Enable in staging/production; leave disabled in local dev



