server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: provider-service
          uri: ${PROVIDER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/providers/**, /api/v1/profiles/**, /api/v1/pets/**, /api/v1/addresses/**
        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/catalog/**
        - id: discovery-service
          uri: ${DISCOVERY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/discovery/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/orders/**
        - id: appointment-service
          uri: ${APPOINTMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/appointments/**
        - id: dispatch-service
          uri: ${DISPATCH_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/dispatch/**
        - id: captain-service
          uri: ${CAPTAIN_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/captains/**
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWT_JWK_SET_URI:https://your-project.supabase.co/rest/v1/auth/keys}
          secret-key: ${SUPABASE_JWT_SECRET:} # HS256 JWT secret for symmetric validation (optional dev fallback)
