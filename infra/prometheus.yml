global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    authorization:
      credentials: 'dev-gateway-secret-key'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'provider-service'
    metrics_path: '/actuator/prometheus'
    authorization:
      credentials: 'dev-gateway-secret-key'
    static_configs:
      - targets: ['provider-service:8081']

  - job_name: 'catalog-service'
    metrics_path: '/actuator/prometheus'
    authorization:
      credentials: 'dev-gateway-secret-key'
    static_configs:
