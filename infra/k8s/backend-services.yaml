apiVersion: v1
kind: ConfigMap
metadata:
  name: pawsnearme-backend-config
data:
  DB_POOL_MAX_SIZE: '5'
  DB_POOL_MIN_IDLE: '2'
  DB_POOL_CONNECTION_TIMEOUT_MS: '5000'
  DB_POOL_MAX_SIZE_DISCOVERY: '8'
  DB_POOL_MAX_SIZE_CATALOG: '8'
  DB_POOL_MAX_SIZE_APPOINTMENT: '8'
  DB_POOL_MAX_SIZE_ORDER: '8'
  DB_POOL_MAX_SIZE_PAYMENT: '8'
  DB_POOL_MAX_SIZE_DISPATCH: '6'
  DB_POOL_MAX_SIZE_PROVIDER: '6'
  DB_POOL_MAX_SIZE_CHAT: '6'
  DB_POOL_MAX_SIZE_NOTIFICATION: '4'
  DB_POOL_MAX_SIZE_REVIEW: '4'
  DB_POOL_MAX_SIZE_CAPTAIN: '4'
  DB_POOL_MAX_SIZE_CONTENT: '4'
  KAFKA_LISTENER_CONCURRENCY: '3'
  GATEWAY_TRUST_ENABLED: 'true'
  GATEWAY_RATE_LIMIT_REPLENISH_RATE: '100'
  GATEWAY_RATE_LIMIT_BURST_CAPACITY: '200'
---
apiVersion: v1
kind: Secret
metadata:
  name: pawsnearme-backend-secrets
type: Opaque
stringData:
  SUPAVISOR_DB_URL: jdbc:postgresql://aws-0-region.pooler.supabase.com:6543/postgres?sslmode=require
  DB_USERNAME: postgres.project-ref
  DB_PASSWORD: replace-me
  GATEWAY_SECRET: replace-me
  KAFKA_BOOTSTRAP_SERVERS: replace-me:9092
  REDIS_HOST: replace-me
  REDIS_PORT: '6379'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: ghcr.io/your-org/pawsnearme-api-gateway:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: pawsnearme-backend-config
        - secretRef:
            name: pawsnearme-backend-secrets
        env:
        - name: PROVIDER_SERVICE_URL
          value: http://provider-service:8081
        - name: CATALOG_SERVICE_URL
          value: http://catalog-service:8082
        - name: DISCOVERY_SERVICE_URL
          value: http://discovery-service:8083
        - name: ORDER_SERVICE_URL
          value: http://order-service:8084
        - name: APPOINTMENT_SERVICE_URL
          value: http://appointment-service:8085
        - name: DISPATCH_SERVICE_URL
          value: http://dispatch-service:8086
        - name: CAPTAIN_SERVICE_URL
          value: http://captain-service:8087
        - name: NOTIFICATION_SERVICE_URL
          value: http://notification-service:8088
        - name: REVIEW_SERVICE_URL
          value: http://review-service:8089
        - name: PAYMENT_SERVICE_URL
          value: http://payment-service:8090
        - name: CHAT_SERVICE_URL
          value: http://chat-service:8091
        - name: CONTENT_SERVICE_URL
          value: http://content-service:8092
        resources:
          requests:
            cpu: 250m
            memory: 384Mi
          limits:
            cpu: '1'
            memory: 768Mi
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      containers:
      - name: discovery-service
        image: ghcr.io/your-org/pawsnearme-discovery-service:latest
        ports:
        - containerPort: 8083
        envFrom:
        - configMapRef:
            name: pawsnearme-backend-config
        - secretRef:
            name: pawsnearme-backend-secrets
        env:
        - name: SERVER_PORT
          value: '8083'
        - name: DB_POOL_MAX_SIZE
          valueFrom:
            configMapKeyRef:
              name: pawsnearme-backend-config
              key: DB_POOL_MAX_SIZE_DISCOVERY
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8083
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
---
