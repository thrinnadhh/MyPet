services:
  provider-service:
    environment:
      MEDICAL_REPORTS_BUCKET: ${MEDICAL_REPORTS_BUCKET:-mypet-local-medical-reports}
      MEDICAL_REPORTS_REGION: ${MEDICAL_REPORTS_REGION:-ap-south-1}
      MEDICAL_REPORTS_ACCESS_KEY: ${MEDICAL_REPORTS_ACCESS_KEY:-local-test-access-key}
      MEDICAL_REPORTS_SECRET_KEY: ${MEDICAL_REPORTS_SECRET_KEY:-local-test-secret-key}

  appointment-service:
    environment:
      APPOINTMENT_MEDICAL_DOCUMENTS_PUBLIC_BASE_URL: http://localhost:8080
      MEDICAL_DOCUMENT_SIGNING_KEY: ${MEDICAL_DOCUMENT_SIGNING_KEY:-0123456789abcdef0123456789abcdef}

  captain-service:
    environment:
      BANK_DATA_ENCRYPTION_KEY: ${BANK_DATA_ENCRYPTION_KEY:?BANK_DATA_ENCRYPTION_KEY must be set}

  order-service:
    environment:
      ORDER_ONLINE_PAYMENTS_ENABLED: "true"
      ORDER_CASE_EVIDENCE_PUBLIC_BASE_URL: http://localhost:8080
      CASE_EVIDENCE_SIGNING_KEY: ${CASE_EVIDENCE_SIGNING_KEY:-abcdef0123456789abcdef0123456789}
      ORDER_RECURRING_REMINDER_CRON: ${ORDER_RECURRING_REMINDER_CRON:-0 0 * * * *}
      ORDER_RECURRING_REMINDER_LOCK_AT_MOST_FOR: ${ORDER_RECURRING_REMINDER_LOCK_AT_MOST_FOR:-PT55M}
      ORDER_RECURRING_REMINDER_LOCK_AT_LEAST_FOR: ${ORDER_RECURRING_REMINDER_LOCK_AT_LEAST_FOR:-PT1M}

  payment-service:
    environment:
      CASHFREE_SANDBOX_MODE: "true"
      CASHFREE_API_VERSION: "2025-01-01"
      # Explicitly blank in local/full-stack validation so the payment service uses
      # its deterministic Cashfree sandbox adapter instead of making external calls.
      CASHFREE_CLIENT_ID: ""
      CASHFREE_CLIENT_SECRET: ""
      CASHFREE_WEBHOOK_SECRET: ${CASHFREE_WEBHOOK_SECRET:-local-cashfree-webhook-secret}
      PAYMENT_CHECKOUT_TOKEN_SECRET: ${PAYMENT_CHECKOUT_TOKEN_SECRET:-0123456789abcdef0123456789abcdef}

  notification-service:
    environment:
      NOTIFICATION_DELIVERY_MODE: LOGGED_DEV

  api-gateway:
    environment:
      SPRING_PROFILES_ACTIVE: local,docker
      ALLOW_UNSIGNED_JWT: "true"
      SUPABASE_JWT_SECRET: ""
      SUPABASE_JWT_JWK_SET_URI: ""