<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawsNearMe — Super Admin Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #111827;
            --bg-glass: rgba(17, 24, 39, 0.7);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.15);
            --accent-amber: #f59e0b;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --font-main: 'Outfit', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-main);
            min-height: 100vh;
            background-image: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(245, 158, 11, 0.03) 0%, transparent 40%);
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            padding: 1.25rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-badge {
            background: linear-gradient(135deg, var(--primary), var(--accent-amber));
            color: #fff;
            font-weight: 800;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
            flex: 1;
        }

        /* Tabs Navigation */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            background: var(--bg-secondary);
            padding: 0.35rem;
            border-radius: 12px;
            border: 1px solid var(--border-glass);
            max-width: fit-content;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: var(--font-main);
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.6rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* Grid Panels */
        .grid-panels {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 900px) {
            .grid-panels {
                grid-template-columns: 2fr 1fr;
            }
        }

        /* Card Elements */
        .card {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 1.75rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            margin-bottom: 1.5rem;
            transition: transform 0.25s ease;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 0.75rem;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Toggle Button styling */
        .config-toggle-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
        }

        .toggle-switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid var(--border-glass);
        }

        .toggle-label-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 54px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #374151;
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-emerald);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* List Items styling */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .list-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            transition: all 0.2s ease;
        }

        .list-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(59, 130, 246, 0.3);
            transform: translateY(-2px);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .item-title {
            font-size: 1.05rem;
            font-weight: 700;
        }

        .item-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .badge-pending { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); }
        .badge-success { background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald); }
        .badge-danger { background: rgba(244, 63, 94, 0.15); color: var(--accent-rose); }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .btn {
            background: var(--primary);
            border: none;
            color: #fff;
            font-family: var(--font-main);
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .btn:hover {
            background: #2563eb;
        }

        .btn-emerald {
            background: var(--accent-emerald);
        }

        .btn-emerald:hover {
            background: #059669;
        }

        .btn-rose {
            background: var(--accent-rose);
        }

        .btn-rose:hover {
            background: #e11d48;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .empty-icon {
            font-size: 2.5rem;
        }

        /* Modal Overlay styling */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            width: 90%;
            max-width: 480px;
            padding: 2rem;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal.active .modal-card {
            transform: scale(1);
        }

        .modal-header {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .modal-body {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            padding: 0.75rem;
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 0.9rem;
            resize: none;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Config Cards */
        .metric-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
        }

        .alert-toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            border-left: 4px solid var(--primary);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            z-index: 10000;
            transform: translateY(150%);
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

</head>
<body>
    <!-- Admin Authentication Login Modal Overlay -->
    <div id="admin-login-modal" style="position: fixed; inset: 0; background: rgba(11, 15, 25, 0.95); backdrop-filter: blur(16px); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 1.5rem;">
        <div style="background: var(--bg-secondary); border: 1px solid var(--border-glass); border-radius: 16px; padding: 2.5rem; max-width: 420px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center;">
            <div style="display: inline-block; background: linear-gradient(135deg, var(--primary), var(--accent-amber)); color: #fff; font-weight: 800; padding: 0.5rem 1rem; border-radius: 10px; font-size: 1.1rem; margin-bottom: 1.5rem; letter-spacing: 0.05em;">PNM SUPER ADMIN</div>
            <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--text-primary);">Authenticate Console</h2>
            <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1.5rem;">Enter Admin Authentication Token or Secret Key to access governance tools.</p>
            <form onsubmit="handleAdminLogin(event)">
                <input type="password" id="admin-token-input" placeholder="Enter Super Admin Token (e.g. admin123)" required style="width: 100%; padding: 0.85rem 1rem; background: var(--bg-primary); border: 1px solid var(--border-glass); border-radius: 8px; color: var(--text-primary); font-size: 0.95rem; margin-bottom: 1.25rem; outline: none;">
                <button type="submit" class="btn btn-emerald" style="width: 100%; padding: 0.85rem; font-size: 1rem; font-weight: 700; border-radius: 8px;">🔓 Access Console</button>
            </form>
            <p id="login-error-msg" style="color: var(--accent-rose); font-size: 0.85rem; margin-top: 1rem; display: none;"></p>
        </div>
    </div>

    <header>
        <div class="header-title-group">
            <span class="logo-badge">PNM</span>
            <h1>Super Admin Console</h1>
        </div>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <div style="font-size: 0.85rem; color: var(--text-secondary);">
                Environment: <span style="color: var(--accent-emerald); font-weight: bold;">LOCAL_SANDBOX</span>
            </div>
            <div id="admin-session-badge" style="display: none; align-items: center; gap: 0.75rem;">
                <span class="badge badge-verified">ADMIN AUTHENTICATED</span>
                <button class="btn btn-rose" onclick="handleAdminSignOut()" style="padding: 0.35rem 0.75rem; font-size: 0.8rem;">🔒 Sign Out</button>
            </div>
        </div>
    </header>
    <main class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('approvals')">Provider Approvals</button>
            <button class="tab-btn" onclick="switchTab('disputes')">Support Disputes</button>
            <button class="tab-btn" onclick="switchTab('banner-auction')">Banner Auction</button>
            <button class="tab-btn" onclick="switchTab('users')">User Management</button>
            <button class="tab-btn" onclick="switchTab('analytics')">📊 Analytics & Shops</button>
        </div>

        <div class="grid-panels">
            <!-- Left Side: List Content -->
            <section>
                <!-- Approvals Panel -->
                <div id="approvals-panel" class="tab-panel">
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">🛡️ Onboarding Queue</h2>
                            <button class="btn btn-emerald" onclick="fetchPendingProviders()">🔄 Refresh</button>
                        </div>
                        <div id="pending-providers-list" class="list-container">
                            <div class="empty-state">
                                <span class="empty-icon">⏳</span>
                                <p>Loading onboarding queue...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Banner Auction Panel -->
                <div id="banner-auction-panel" class="tab-panel" style="display: none;">
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">🎯 Banner Auction Outcomes</h2>
                            <button class="btn btn-emerald" onclick="fetchBannerAuctionOutcomes()">🔄 Refresh</button>
                        </div>
                        <div id="banner-auction-list" class="list-container">
                            <div class="empty-state">
                                <span class="empty-icon">⏳</span>
                                <p>Loading auction outcomes...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Disputes Panel -->
                <div id="disputes-panel" class="tab-panel" style="display: none;">
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">⚖️ Dispute Management Queue</h2>
                            <button class="btn btn-emerald" onclick="fetchDisputes()">🔄 Refresh</button>
                        </div>
                        <div id="disputes-list" class="list-container">
                            <div class="empty-state">
                                <span class="empty-icon">⏳</span>
                                <p>Loading disputes queue...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Users Panel -->
                <div id="users-panel" class="tab-panel" style="display: none;">
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">👤 User Management</h2>
                            <button class="btn btn-emerald" onclick="fetchUsers()">🔄 Refresh</button>
                        </div>
                        <div id="users-list" class="list-container">
                            <div class="empty-state">
                                <span class="empty-icon">⏳</span>
                                <p>Loading users...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Analytics & Shop Directory Panel -->
                <div id="analytics-panel" class="tab-panel" style="display: none;">
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">📈 Revenue Analytics & GMV Summary</h2>
                            <button class="btn btn-emerald" onclick="fetchAdminAnalytics()">🔄 Refresh</button>
                        </div>
                        <div id="analytics-summary-content" class="list-container">
                            <div class="empty-state">
                                <span class="empty-icon">⏳</span>
                                <p>Loading revenue analytics...</p>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">🏪 Shop & Provider Directory</h2>
                            <div style="display: flex; gap: 0.5rem;">
                                <input type="text" id="shop-search-input" placeholder="Search by name/city..." oninput="filterShopDirectory()" style="padding: 0.4rem 0.8rem; background: var(--bg-primary); border: 1px solid var(--border-glass); border-radius: 6px; color: var(--text-primary); font-size: 0.85rem;">
                                <button class="btn btn-emerald" onclick="fetchAllProvidersDirectory()">🔄 Refresh</button>
                            </div>
                        </div>
                        <div id="shops-directory-list" class="list-container">
                            <div class="empty-state">
                                <span class="empty-icon">⏳</span>
                                <p>Loading shop directory...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Right Side: Sidebar Widgets -->
            <aside>
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">⚙️ Policy Control Configuration</h2>
                    </div>
                    <div class="config-toggle-group">
                        <div class="toggle-switch-container">
                            <div>
                                <h3 style="font-size: 0.95rem; font-weight: 700;">Dispute Automated Refund</h3>
                                <p class="toggle-label-desc">Toggle Option A (Manual) vs Option B (Automated Razorpay Refund)</p>
                            </div>
                            <label class="switch">
                                <input type="checkbox" id="refund-mode-checkbox" onchange="toggleRefundMode(this.checked)">
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">📈 System Statistics</h2>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 1rem;">
                        <div class="metric-card">
                            <div>
                                <h4 style="font-size: 0.85rem; color: var(--text-secondary);">Default Commission Rate</h4>
                                <p style="font-size: 0.75rem; color: var(--text-secondary);">Platform fee on transactions</p>
                            </div>
                            <span class="metric-value">12.5%</span>
                        </div>
                        <div class="metric-card">
                            <div>
                                <h4 style="font-size: 0.85rem; color: var(--text-secondary);">Microservices Status</h4>
                                <p style="font-size: 0.75rem; color: var(--text-secondary);">Gateway discovery registrations</p>
                            </div>
                            <span class="badge badge-success">11 ONLINE</span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <!-- Dispute Resolution Modal -->
    <div id="dispute-modal" class="modal">
        <div class="modal-card">
            <h2 class="modal-header">Resolve Dispute Ticket</h2>
            <div class="modal-body">
                <p id="modal-dispute-reason" style="font-size: 0.9rem; color: var(--text-secondary);"></p>
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="resolution-notes" style="font-size: 0.85rem; font-weight: 700;">Resolution Notes</label>
                    <textarea id="resolution-notes" placeholder="Enter resolution notes, refund authorization ID, or audit remarks..."></textarea>
                </div>
            </div>
            <div class="btn-group" style="justify-content: flex-end;">
                <button class="btn btn-rose" style="background-color: #374151;" onclick="closeDisputeModal()">Cancel</button>
                <button class="btn btn-rose" onclick="submitResolution('REJECTED')">Reject Dispute</button>
                <button class="btn btn-emerald" onclick="submitResolution('RESOLVED')">Approve & Resolve</button>
            </div>
        </div>
    </div>

    <!-- Alert Toast -->
    <div id="alert-toast" class="alert-toast">
        <span id="toast-icon">✅</span>
        <span id="toast-message">Success!</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script src="secure-admin.js"></script>
</body>
</html>
